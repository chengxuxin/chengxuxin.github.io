# Site configuration
name: Xuxin Cheng
url: https://xuxin.ai
description: >-
  Xuxin Cheng is a researcher at Meta building AI systems that see, think,
  and act in real time. PhD from UC San Diego; previously CMU and UC Berkeley.
  Robot learning, humanoids, teleoperation, and embodied AI.
image: /images/grad.jpg
twitter:
  username: xuxin_cheng
  card: summary

# Used to auto-bold your name in publication author lists
name_bold: "<strong>Xuxin Cheng</strong>"

# Publications live in _publications/, one file per paper.
# See README.md for the front-matter format.
collections:
  publications:
    output: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME

include:
  - _pages
