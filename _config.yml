# Site configuration
name: Xuxin Cheng
url: https://chengxuxin.github.io

# Used to auto-bold your name in publication author lists
name_bold: "<strong>Xuxin Cheng</strong>"

# Publications live in _publications/, one file per paper.
# See README.md for the front-matter format.
collections:
  publications:
    output: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME

include:
  - _pages
