<!DOCTYPE html>
<html lang="en">

<head>
  {% if jekyll.environment == 'production' %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1CLN7VBVH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1CLN7VBVH');
  </script>
  {% endif %}

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.name }}</title>
  <meta name="author" content="{{ site.name }}">
  {% seo title=false %}

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon_io/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon_io/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/favicon_io/apple-touch-icon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/images/favicon_io/favicon.ico' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-name" href="{{ site.baseurl }}/">{{ site.name }}</a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#highlights">Highlights</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#publications">Publications</a></li>
      </ul>
    </div>
  </nav>

  <main class="site-main" id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.name }}</span>
    <span><a href="https://peterljq.github.io">Ref Design</a></span>
  </footer>

  <script>
    // Hover-to-play videos and gif swaps on publication thumbnails
    document.querySelectorAll('.pub-thumb').forEach(function (thumb) {
      var video = thumb.querySelector('video');
      var img = thumb.querySelector('img[data-gif]');
      if (video) {
        thumb.addEventListener('mouseenter', function () { video.play().catch(function () {}); });
        thumb.addEventListener('mouseleave', function () { video.pause(); video.currentTime = 0; });
      } else if (img) {
        var still = img.src;
        thumb.addEventListener('mouseenter', function () { img.src = img.dataset.gif; });
        thumb.addEventListener('mouseleave', function () { img.src = still; });
      }
    });

    // BibTeX toggle: show/hide the block under the link row, fetch text on first open
    document.querySelectorAll('.pub-bib-toggle').forEach(function (btn) {
      var box = document.getElementById(btn.getAttribute('aria-controls'));
      if (!box) return;
      var pre = box.querySelector('pre');
      btn.addEventListener('click', function () {
        var open = box.hidden;
        box.hidden = !open;
        btn.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open && !pre.dataset.loaded) {
          fetch(pre.dataset.src)
            .then(function (r) { return r.text(); })
            .then(function (t) { pre.textContent = t.trim(); pre.dataset.loaded = '1'; })
            .catch(function () { pre.textContent = 'Failed to load BibTeX. Click BibTeX again to retry.'; });
        }
      });
    });

    // Copy BibTeX to clipboard
    document.querySelectorAll('.pub-bib-copy').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var pre = btn.parentNode.querySelector('pre');
        if (!pre.dataset.loaded) return;
        var flash = function () {
          btn.textContent = 'Copied';
          btn.classList.add('is-copied');
          setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('is-copied'); }, 1500);
        };
        var fallback = function () {
          var r = document.createRange(); r.selectNodeContents(pre);
          var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
          try { document.execCommand('copy'); } catch (e) {}
          sel.removeAllRanges();
          flash();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(pre.textContent).then(flash).catch(fallback);
        } else {
          fallback();
        }
      });
    });

    // Highlight videos: play only while in view; respect reduced-motion
    (function () {
      var vids = document.querySelectorAll('.highlight-video');
      if (!vids.length) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; // leave posters static
      if (!('IntersectionObserver' in window)) {
        vids.forEach(function (v) { v.play().catch(function () {}); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          var v = e.target;
          if (e.isIntersecting && !document.hidden) { v.play().catch(function () {}); }
          else { v.pause(); }
        });
      }, { threshold: 0.25 });
      vids.forEach(function (v) { io.observe(v); });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) vids.forEach(function (v) { v.pause(); });
      });
    })();
  </script>
</body>

</html>
