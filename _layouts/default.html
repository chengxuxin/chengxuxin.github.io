<!DOCTYPE html>
<html lang="en">

<head>
  {% if jekyll.environment == 'production' %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1CLN7VBVH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1CLN7VBVH');
  </script>
  {% endif %}

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.name }}</title>
  <meta name="author" content="{{ site.name }}">
  {% seo title=false %}

  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css">
</head>

<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-name" href="{{ site.baseurl }}/">{{ site.name }}</a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#highlights">Highlights</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#publications">Publications</a></li>
      </ul>
    </div>
  </nav>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>&copy; {{ 'now' | date: '%Y' }} {{ site.name }}</span>
    <span><a href="https://peterljq.github.io">Ref Design</a></span>
  </footer>

  <script>
    // Hover-to-play videos and gif swaps on publication thumbnails
    document.querySelectorAll('.pub-thumb').forEach(function (thumb) {
      var video = thumb.querySelector('video');
      var img = thumb.querySelector('img[data-gif]');
      if (video) {
        thumb.addEventListener('mouseenter', function () { video.play(); });
        thumb.addEventListener('mouseleave', function () { video.pause(); video.currentTime = 0; });
      } else if (img) {
        var still = img.src;
        thumb.addEventListener('mouseenter', function () { img.src = img.dataset.gif; });
        thumb.addEventListener('mouseleave', function () { img.src = still; });
      }
    });

    // Lazy-load BibTeX text the first time an entry is expanded
    document.querySelectorAll('.pub-bib').forEach(function (details) {
      details.addEventListener('toggle', function () {
        var pre = details.querySelector('pre');
        if (details.open && pre && !pre.dataset.loaded) {
          pre.dataset.loaded = '1';
          fetch(pre.dataset.src)
            .then(function (r) { return r.text(); })
            .then(function (t) { pre.textContent = t.trim(); })
            .catch(function () { pre.textContent = 'Failed to load BibTeX.'; });
        }
      });
    });
  </script>
</body>

</html>
